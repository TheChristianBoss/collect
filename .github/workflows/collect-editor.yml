name: Collect Editor checks

on:
  push:
    branches: [feature/collect-editor-mvp]
    paths:
      - "collect-editor/**"
      - ".github/workflows/collect-editor.yml"
  pull_request:
    paths:
      - "collect-editor/**"
      - ".github/workflows/collect-editor.yml"

jobs:
  editor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r collect-editor/requirements.txt
      - name: Test timeline algorithms
        working-directory: collect-editor
        run: node --test tests/timeline-core.test.js
      - name: Test FFmpeg rendering, transitions and waveforms
        working-directory: collect-editor
        run: python -m unittest discover -s tests -v
